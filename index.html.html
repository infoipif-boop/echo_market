<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECHO StartUp Market 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F3; --surface:#FFFFFF; --ink:#0F1923; --ink-2:#4A5966; --line:#D3DEDC;
  --mint:#00B894; --mint-ink:#006B56; --gold:#FFD166; --gold-ink:#5C4300; --coral:#FF6B6B;
  --chip:#F2F6F5; --focus:#0F1923;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1923; --surface:#16232F; --ink:#EAF2F1; --ink-2:#9FB0BC; --line:#25384A;
    --mint:#00D4AA; --mint-ink:#00D4AA; --gold:#FFD166; --gold-ink:#0F1923; --chip:#1D2E3C; --focus:#00D4AA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1923; --surface:#16232F; --ink:#EAF2F1; --ink-2:#9FB0BC; --line:#25384A;
  --mint:#00D4AA; --mint-ink:#00D4AA; --gold:#FFD166; --gold-ink:#0F1923; --chip:#1D2E3C; --focus:#00D4AA;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.01em;text-decoration:none}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:600 14px var(--body);background:transparent;color:var(--ink);border:0;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.awning{height:34px;background:repeating-linear-gradient(90deg,#00D4AA 0 60px,#FFD166 60px 120px,#FF6B6B 120px 180px,#9B8CFF 180px 240px,#4DA8FF 240px 300px)}
.awning-fringe{height:14px;background:
  radial-gradient(circle 30px at 30px 0,#00D4AA 29px,transparent 30px) 0 0/300px 14px repeat-x,
  radial-gradient(circle 30px at 90px 0,#FFD166 29px,transparent 30px) 0 0/300px 14px repeat-x,
  radial-gradient(circle 30px at 150px 0,#FF6B6B 29px,transparent 30px) 0 0/300px 14px repeat-x,
  radial-gradient(circle 30px at 210px 0,#9B8CFF 29px,transparent 30px) 0 0/300px 14px repeat-x,
  radial-gradient(circle 30px at 270px 0,#4DA8FF 29px,transparent 30px) 0 0/300px 14px repeat-x}
.hero{padding:56px 0 40px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8vw,96px);line-height:1;margin:0 0 20px;letter-spacing:-.01em}
.hero h1 span{display:block}
.hero p.lead{font-size:clamp(17px,2vw,20px);max-width:62ch;color:var(--ink-2);margin:0 0 8px}
.hero p.by{font-size:14px;color:var(--ink-2);margin:0}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:40px 0 0;padding:0;list-style:none;border-top:2px solid var(--ink)}
.steps li{padding:16px 16px 4px 0;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-size:32px;line-height:1;display:block;margin-bottom:8px;color:var(--mint-ink)}
.steps b{display:block;font-size:16px}
.steps span{font-size:14px;color:var(--ink-2)}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}}

/* filter */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:48px 0 20px}
.bar h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 auto 0 0}
.filter button{font:500 15px var(--body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}
.filter button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* stalls */
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:28px;padding-bottom:24px}
@media (max-width:420px){.stalls{grid-template-columns:1fr}}
.stall{background:var(--surface);border:1px solid var(--line);border-radius:4px 4px 14px 14px;display:flex;flex-direction:column;position:relative}
.stall .roof{height:22px;border-radius:4px 4px 0 0;
  background:repeating-linear-gradient(90deg,var(--c) 0 28px,var(--c2) 28px 56px)}
.stall .fringe{height:12px;margin-bottom:6px;
  background:radial-gradient(circle 14px at 14px 0,var(--c) 13px,transparent 14px) 0 0/56px 12px repeat-x,
             radial-gradient(circle 14px at 42px 0,var(--c2) 13px,transparent 14px) 0 0/56px 12px repeat-x}
.stall .in{padding:10px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.team{font-size:14px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.code{font-variant-numeric:tabular-nums}
.stall h3{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:2px 0 4px}
.tag{font-weight:500;margin:0}
.intro{color:var(--ink-2);font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.intro.open{-webkit-line-clamp:unset;display:block}
.more{align-self:flex-start;background:none;border:0;padding:0;font:500 14px var(--body);color:var(--mint-ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pdp{display:block;text-align:center;text-decoration:none;font-weight:700;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px}
.group h4{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;text-decoration:none;padding:6px 12px;border-radius:8px;background:var(--chip);border:1px solid var(--line);white-space:nowrap}
.chip.buy{background:var(--gold);color:#3D2C00;border-color:transparent;font-weight:700}
.chip.off{opacity:.55;cursor:not-allowed}
.foot{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.survey{flex:1;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--mint);color:var(--mint-ink);padding:10px 12px;border-radius:10px}
.share{font:600 14px var(--body);background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.empty{font-size:14px;color:var(--ink-2);margin:0}

/* rules + footer */
.rules{margin:48px 0 0;padding:28px 0;border-top:2px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:760px){.rules{grid-template-columns:1fr}}
.rules h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 10px}
.rules p,.rules li{color:var(--ink-2);font-size:15px}
.rules ul{padding-left:18px;margin:0}
footer{padding:28px 0 40px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#">ECHO Market</a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-l="ko">한국어</button><button type="button" data-l="en">English</button>
  </div>
</div></header>

<div class="awning" aria-hidden="true"></div><div class="awning-fringe" aria-hidden="true"></div>

<main class="wrap">

    <p class="lead" data-t="lead"></p>
    <p class="by" data-t="by"></p>
    <ol class="steps">
      <li><b data-t="s1"></b><span data-t="s1d"></span></li>
      <li><b data-t="s2"></b><span data-t="s2d"></span></li>
      <li><b data-t="s3"></b><span data-t="s3d"></span></li>
      <li><b data-t="s4"></b><span data-t="s4d"></span></li>
    </ol>
  </section>

  <div class="bar">
    <h2 data-t="stallsTitle"></h2>
    <div class="filter" role="group" aria-label="Filter">
      <button type="button" data-f="all"></button>
      <button type="button" data-f="suwon"></button>
      <button type="button" data-f="paju"></button>
      <button type="button" data-f="hwaseong"></button>
    </div>
  </div>
  <div class="stalls" id="stalls"></div>

  <section class="rules">
    <div>
      <h2 data-t="rTitle"></h2>
      <ul>
        <li data-t="r1"></li>
        <li data-t="r2"></li>
        <li data-t="r3"></li>
      </ul>
    </div>
    <div>
      <h2 data-t="pTitle"></h2>
      <p data-t="p1"></p>
    </div>
  </section>
</main>
<footer><div class="wrap" data-t="footer"></div></footer>

let lang = "ko", filter = "all";
try{
  const q = new URLSearchParams(location.search).get("lang");
  const saved = localStorage.getItem("echo-market-lang");
  lang = q==="en"||q==="ko" ? q : (saved || ((navigator.language||"ko").startsWith("ko")?"ko":"en"));
}catch(e){ lang = (navigator.language||"ko").startsWith("ko")?"ko":"en"; }

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link = (url, label, cls) => url
  ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`
  : `<span class="${cls} off" aria-disabled="true">${esc(label)} (${T[lang].soon})</span>`;

function render(){
  const t = T[lang], li = lang==="ko"?0:1;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l===lang));
  document.querySelectorAll(".filter button").forEach(b => { b.textContent = t[b.dataset.f]; b.setAttribute("aria-pressed", b.dataset.f===filter); });

  const list = TEAMS.filter(x => filter==="all" || x.city===filter);
  if(!list.length){ document.getElementById("stalls").innerHTML = `<p class="empty">${t.noTeams}</p>`; return; }
  document.getElementById("stalls").innerHTML = list.map(x => `
  <article class="stall" id="${x.code}" style="--c:${x.c};--c2:${x.c2}">
    <div class="roof"></div><div class="fringe"></div>
    <div class="in">
      <div>
        <div class="team"><span>${esc(x.team)} · ${t.city[x.city]}</span><span class="code">${x.code}</span></div>
        <h3>${esc(x.product)}</h3>
        <p class="tag">${x.tag ? esc(x.tag[lang]) : esc(t.soon)}</p>
      </div>
      ${x.intro ? `<p class="intro">${esc(x.intro[lang])}</p><button type="button" class="more" aria-expanded="false">${t.more}</button>` : ""}
      ${link(x.pdp, t.pdp, "pdp")}
      <div class="group"><h4>${t.buy}</h4>
        ${x.buy.length ? `<div class="chips">${x.buy.map(b => link(BUY(b[2]), b[li], "chip buy")).join("")}</div>` : `<p class="empty">${t.noBuy}</p>`}
      </div>
      <div class="group"><h4>${t.media}</h4>
        <div class="chips">${x.media.map(m => link(m[2], m[li], "chip")).join("")}</div>
      </div>
      <div class="foot">
        ${x.survey ? link(x.survey, t.survey, "survey") : `<span class="survey chip off" aria-disabled="true">${t.noSurvey}</span>`}
        <button type="button" class="share" data-code="${x.code}">${t.share}</button>
      </div>
    </div>
  </article>`).join("");
}

document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  lang = b.dataset.l; try{ localStorage.setItem("echo-market-lang", lang); }catch(err){}
  render();
});
document.querySelector(".filter").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return; filter = b.dataset.f; render();
});
const toast = msg => { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2200); };
document.getElementById("stalls").addEventListener("click", async e => {
  const more = e.target.closest(".more");
  if(more){ const p = more.previousElementSibling; const open = p.classList.toggle("open");
    more.textContent = open ? T[lang].less : T[lang].more; more.setAttribute("aria-expanded", open); return; }
  const sh = e.target.closest(".share");
  if(sh){
    const url = location.href.split("#")[0].split("?")[0] + "?lang=" + lang + "#" + sh.dataset.code;
    try{ await navigator.clipboard.writeText(url); toast(T[lang].copied); }
    catch(err){ toast(T[lang].copyFail); }
  }
});
render();
</script>
